{% extends "base.html" %}
{% block title %}ログイン | face-swap{% endblock %}
{% block content %}
<div class="card" style="max-width: 420px; margin: var(--space-7) auto;">
  <h1>ログイン</h1>
  <form method="post" class="stack">
    <div><label for="email">メールアドレス</label><input id="email" name="email" type="email" autocomplete="username" required></div>
    <div><label for="password">パスワード</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn primary" type="submit">ログイン</button>
  </form>
</div>
{% endblock %}
