# Render blueprint for face-swap. Secret values are entered in the Render dashboard, not here.
# The C2PA signing certificate is created automatically on first start.
# Web is on the free plan: it sleeps when idle and takes about a minute to wake up.
services:
- type: web
  name: face-swap-web
  runtime: docker
  plan: free
  rootDir: face_swap
  dockerfilePath: ./Dockerfile
  healthCheckPath: /healthz
  envVars:
  - key: APP_ENV
    value: production
  - key: STORAGE
    value: r2
  - key: SAFETY
    value: claude
  - key: SECRET_KEY
    generateValue: true
  - key: DATABASE_URL
    fromDatabase:
      name: face-swap-db
      property: connectionString
  - key: OWNER_EMAIL
    sync: false
  - key: OWNER_PASSWORD
    sync: false
  - key: ANTHROPIC_API_KEY
    sync: false
  - key: FACESWAP_PROVIDER
    value: facemint
  - key: FACEMINT_API_KEY
    sync: false
  - key: FACEMINT_FACE_RECOGNITION
    value: '0.6'
  - key: FACESWAP_PRICE_PER_SECOND_USD
    sync: false
  - key: DAILY_SPEND_LIMIT_USD
    value: '20'
  - key: R2_ENDPOINT
    sync: false
  - key: R2_BUCKET
    sync: false
  - key: R2_ACCESS_KEY_ID
    sync: false
  - key: R2_SECRET_ACCESS_KEY
    sync: false
- type: worker
  name: face-swap-worker
  runtime: docker
  plan: starter
  rootDir: face_swap
  dockerfilePath: ./Dockerfile
  dockerCommand: python worker.py
  envVars:
  - key: APP_ENV
    value: production
  - key: STORAGE
    value: r2
  - key: SAFETY
    value: claude
  - key: SECRET_KEY
    generateValue: true
  - key: DATABASE_URL
    fromDatabase:
      name: face-swap-db
      property: connectionString
  - key: OWNER_EMAIL
    sync: false
  - key: OWNER_PASSWORD
    sync: false
  - key: ANTHROPIC_API_KEY
    sync: false
  - key: FACESWAP_PROVIDER
    value: facemint
  - key: FACEMINT_API_KEY
    sync: false
  - key: FACEMINT_FACE_RECOGNITION
    value: '0.6'
  - key: FACESWAP_PRICE_PER_SECOND_USD
    sync: false
  - key: DAILY_SPEND_LIMIT_USD
    value: '20'
  - key: R2_ENDPOINT
    sync: false
  - key: R2_BUCKET
    sync: false
  - key: R2_ACCESS_KEY_ID
    sync: false
  - key: R2_SECRET_ACCESS_KEY
    sync: false
databases:
- name: face-swap-db
